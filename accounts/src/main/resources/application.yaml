spring:
  application:
    name: accounts

  datasource:
    username: sa
    password:
    url: jdbc:h2:mem:test
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    import:
      - "application_qa.yaml"
      - "application_prod.yaml"
build:
  version: "1.0"